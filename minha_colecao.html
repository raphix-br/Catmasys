<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catmasys — Minha Coleção</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div><h1>CATMASYS</h1><p>Minha Coleção</p></div>
  <nav class="mode-switch">
    <a class="mode-btn" href="index.html">CATÁLOGO</a>
    <a class="mode-btn active" href="minha_colecao.html">MINHA COLEÇÃO</a>
  </nav>
  <div class="catalog-header-controls"><input id="search" type="search" placeholder="Pesquisar jogo..." autocomplete="off"><select id="genre-filter"><option value="">GÊNERO</option></select><select id="year-filter"><option value="">ANO</option></select><select id="sort-filter"><option value="default">ORDEM</option><option value="az">A-Z</option><option value="za">Z-A</option><option value="status">STATUS</option></select><select id="status-filter"><option value="">STATUS</option><option value="CIB">CIB</option><option value="BOXED">BOXED</option><option value="LOOSE">LOOSE</option><option value="INCOMPLETO">INCOMPLETO</option><option value="NAO_POSSUO">NÃO POSSUO</option></select></div>
</header>
<main>
  <div class="collection-toolbar">
    <div class="collection-counts">
      <span id="collection-count"></span>
      <span id="collection-status"></span>
    </div>
    <div id="collection-filters" class="collection-filters">
      <button class="active" data-status="TODOS">TODOS</button>
      <button data-status="CIB">CIB</button>
      <button data-status="BOXED">BOXED</button>
      <button data-status="LOOSE">LOOSE</button>
      <button data-status="INCOMPLETO">INCOMPLETO</button>
      <button data-status="NAO_POSSUO">NÃO POSSUO</button>
    </div>
  </div>
  <section id="collection-grid" class="collection-grid"></section>
</main>
<footer class="site-footer" aria-label="Informações do site"></footer>
<script src="js/games_br.js"></script>
<script src="js/app_colecao.js"></script>
</body>
</html>
