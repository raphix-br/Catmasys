name: Atualizar catalogo a partir do XLSX

on:
  workflow_dispatch:
  push:
    paths:
      - "dados/teste.xlsx"
      - "scripts/gerar_catalogo.py"
      - "dados/mapa_capas.csv"

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar openpyxl
        run: python -m pip install --upgrade openpyxl

      - name: Gerar arquivos derivados
        run: python scripts/gerar_catalogo.py

      - name: Validar alteracoes
        run: |
          python - <<'PY'
          import csv, json, re
          from pathlib import Path

          csv_path = Path("dados/Catalogo_BR.csv")
          js_path = Path("js/games_br.js")

          with csv_path.open(encoding="utf-8-sig", newline="") as f:
              rows = list(csv.DictReader(f))

          js = js_path.read_text(encoding="utf-8")
          m = re.search(r"window\.GAMES\s*=\s*(\[.*\]);\s*$", js, re.S)
          if not m:
              raise SystemExit("games_br.js invalido")

          games = json.loads(m.group(1))
          ids_csv = [r["id"] for r in rows]
          ids_js = [g["id"] for g in games]

          if len(ids_csv) != len(set(ids_csv)):
              raise SystemExit("IDs duplicados no CSV")
          if len(ids_js) != len(set(ids_js)):
              raise SystemExit("IDs duplicados no JS")
          if set(ids_csv) != set(ids_js):
              raise SystemExit("CSV e JS possuem IDs diferentes")

          print(f"Validado: {len(rows)} jogos.")
          PY

      - name: Commitar arquivos derivados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/Catalogo_BR.csv js/games_br.js
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao nos arquivos derivados."
          else
            git commit -m "chore: atualizar catalogo a partir do XLSX"
            git push
          fi
